     y="319"
     text-anchor="middle"
     font-size="22px"
     font-weight="bold"
     fill="#ef4444"
     id="text20">✕</text>
  <!-- 矢印: tor_mcp -> Direct ブラウザ (クリアネット直結、ゲート対象外) -->
  <line
     x1="350"
     y1="165"
     x2="350"
     y2="418"
