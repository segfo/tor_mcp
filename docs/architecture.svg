  <!-- 凡例ボックス -->
  <rect
     x="60"
     y="530"
     width="880"
     height="107.78046"
     rx="6"
     fill="#ffffff"
     stroke="#ef4444"
     stroke-width="1.2715"
     id="rect27"
     ry="6" />
  <text
     x="80"
     y="552"
     font-size="12px"
     font-weight="bold"
     fill="#7f1d1d"
     id="text28">TOR_MCP_DISABLE_TOR=1 のとき（多層防御 第2層、defense-in-depth #2）:</text>
  <text
     x="90"
     y="572"
     font-size="10px"
     fill="#334155"
     id="text29">● tor_check / tor_fetch / tor_new_circuit / onion_search → 常に即座に拒否（backendへ問い合わせない）</text>
  <text
     x="90"
     y="590"
     font-size="10px"
     fill="#334155"
     id="text30">● browser_open → via=&quot;tor&quot; 明示時、または via=&quot;auto&quot; で URL が .onion（Tor解決）のときのみ拒否</text>
  <text
     x="90"
     y="608"
     font-size="10px"
     fill="#334155"
     id="text31">● browser_open via=&quot;direct&quot;、および via=&quot;auto&quot; のクリアネットURLは拒否されない（図の青い経路はゲートの対象外）</text>
  <text
     x="90"
     y="626"
     font-size="10px"
     fill="#6b7280"
     id="text32">既定値: TOR_MCP_DISABLE_TOR 未設定 = 0（ゲート無効、通常どおりTorを使用）</text>
</svg>
