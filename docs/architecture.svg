  <text
     x="750"
     y="450"
     text-anchor="middle"
     font-size="13px"
     font-weight="bold"
     fill="#5b21b6"
     id="text25">Web</text>
  <text
     x="750"
     y="467"
     text-anchor="middle"
     font-size="10px"
